name: docker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # build-context is relative to the repo root.
        images:
          - name: airflow
            build-context: .
            file: airflow/Dockerfile
            build-args: |
              AIRFLOW_VERSION=3.3.2
          - name: dashboard
            build-context: .
            file: dashboard/Dockerfile
            build-args: ''
          - name: reports
            build-context: .
            file: reports/Dockerfile
            build-args: ''
          - name: pipeline
            build-context: .
            file: Dockerfile.pipeline
            build-args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.images.name }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.images.build-context }}
          file: ${{ matrix.images.file }}
          build-args: ${{ matrix.images.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache scope per image so the four matrix jobs don't overwrite each other.
          cache-from: type=gha,scope=${{ matrix.images.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.images.name }}
