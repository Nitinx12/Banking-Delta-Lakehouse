# Heavier tiers that need real infrastructure. Never part of the PR gate.
# - sql-heavy: disposable PostgreSQL service container, applies every SQL file twice
# - dep-audit: known-vulnerability scan of the locked dependencies (nightly, so a new CVE never blocks an unrelated PR)
# - spark: local Spark smoke tests, manual trigger only (workflow_dispatch)
# - notify: opens (or updates) one GitHub issue when a scheduled run fails
name: nightly

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sql-heavy:
    name: sql-smoke + integration (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: banking_delta_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ALLOW_SQL_SMOKE: "1"
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: banking_delta_test
      PG_USER: postgres
      PG_PASS: test-only
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: banking_delta_test
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install
      - run: make install

      - name: Apply all SQL against the disposable database
        run: make sql-smoke

      - name: Integration tests
        run: make integration

  dep-audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  spark:
    name: spark smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install
      - run: make install
      - run: make spark-smoke

  notify:
    name: open issue on scheduled failure
    needs: [sql-heavy, dep-audit]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the nightly-failure issue
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create nightly-failure --color B60205 --description "nightly workflow failed" --force
          existing=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: ${run_url}"
          else
            gh issue create --label nightly-failure \
              --title "nightly failed" \
              --body "The scheduled nightly run failed: ${run_url}"
          fi
