# Heavier tiers that need real infrastructure. Never part of the PR gate.
# - sql-heavy: disposable PostgreSQL service container, applies every SQL file twice
# - spark: local Spark smoke tests behind an opt-in label
name: nightly

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-heavy:
    name: sql-smoke + integration (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: banking_delta_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ALLOW_SQL_SMOKE: "1"
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: banking_delta_test
      PG_USER: postgres
      PG_PASS: test-only
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: banking_delta_test
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install
      - run: make install

      - name: Apply all SQL against the disposable database
        run: make sql-smoke

      - name: Integration tests
        run: make integration

  spark:
    name: spark smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install
      - run: make install
      - run: make spark-smoke
