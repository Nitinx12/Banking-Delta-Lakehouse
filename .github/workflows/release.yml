# Release on version tags. Refuses to publish an unverified commit.
# Flow: verify -> create GitHub release -> trigger cd with the tag.
name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# least privilege by default; only the jobs below that need more ask for it
permissions:
  contents: read

jobs:
  verify:
    name: verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must match pyproject version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$version"
          test "$tag" = "$version"

      - name: Tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false # no cache in a release path (cache poisoning)

      - run: uv python install
      - run: make install

      - name: Gate
        run: make ci

  github-release:
    name: create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create release (idempotent, so a re-run of this workflow works)
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, nothing to do."
            exit 0
          fi
          args=()
          # tags with a hyphen (v1.2.0-rc1) are prereleases
          case "${GITHUB_REF_NAME}" in *-*) args+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${args[@]}"

  trigger-cd:
    name: trigger cd deployment
    # Runs only if verify AND github-release succeeded (no `always()`),
    # so an unverified commit can never be deployed.
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Trigger cd workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            environment="staging"
          else
            environment="production"
          fi
          # cd needs the TAG as ref (production requires a stable vX.Y.Z tag),
          # not the commit SHA.
          gh workflow run cd.yml \
            -f environment="$environment" \
            -f ref="${GITHUB_REF_NAME}"
          echo "Triggered cd for ${GITHUB_REF_NAME} -> ${environment}" >> "$GITHUB_STEP_SUMMARY"
