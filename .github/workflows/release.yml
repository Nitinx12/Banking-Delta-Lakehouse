# Release on version tags. Refuses to publish an unverified commit.
name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# least privilege by default; only the release job gets write access
permissions:
  contents: read

jobs:
  verify:
    name: verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must match pyproject version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$version"
          test "$tag" = "$version"

      - name: Tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install
      - run: make install

      - name: Gate
        run: make ci

  github-release:
    name: create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create release
        run: |
          set -euo pipefail
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes ${flags}
