# Secret scanning over full git history with gitleaks.
name: leaks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: leaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so old commits are scanned

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          version=8.28.0   # bump via PR; check the gitleaks releases page
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/gitleaks_${version}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan
        run: |
          gitleaks version
          gitleaks git --redact -v --config .gitleaks.toml
