name: r-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "r/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-check:
    name: R lint, test and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.6.1"

      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r

      - name: Install extra tools
        run: Rscript -e 'install.packages(c("lintr","rcmdcheck","duckdb","fable","fabletools","tsibble","feasts"), repos = "https://cloud.r-project.org")'
        working-directory: r

      - name: Lint
        run: Rscript -e 'lintr::lint_package(".")'
        working-directory: r

      - name: Test
        run: Rscript -e 'testthat::test_local(".")'
        working-directory: r

      - name: Coverage
        run: |
          Rscript -e 'cov <- covr::package_coverage(".", type = "tests"); pct <- covr::percent_coverage(cov); message(sprintf("coverage: %.1f%%", pct)); if (pct < 60) quit(status = 1)'
        working-directory: r

      - name: R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(".", args = "--no-manual")'
        working-directory: r
