# CI gate. Mirrors `make ci` (lint + contracts + sql-lint + unit + smoke).
# Runs on every push to main and every PR. The `pipeline` job additionally runs
# the full daily pipeline on main so a red commit blocks merge via branch
# protection (which you configure in repo settings).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          version=1.7.12   # bump via PR; check the actionlint releases page
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint" && cd "$RUNNER_TEMP/actionlint"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/actionlint_${version}_checksums.txt"
          grep " ${tarball}\$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint

      - name: Install zizmor
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz -o /tmp/zizmor.tar.gz
          echo "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99  /tmp/zizmor.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zizmor.tar.gz -C /usr/local/bin zizmor

      - name: Run zizmor
        run: zizmor .github/workflows

  gate:
    name: gate (lint + sql-lint + unit + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Lockfile is in sync with pyproject
        run: uv lock --check

      - name: Install dependencies
        run: make install

      - name: Lint (ruff)
        run: make lint

      - name: Data contracts
        run: make contracts

      - name: SQL lint (sqlfluff)
        run: make sql-lint

      - name: Smoke tests
        run: make smoke

      - name: Unit tests + coverage gate
        run: make cov

      - name: Report fixtures render (no TeX, no database)
        run: make report-fixture

  dep-audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  windows-gate:
    name: windows-gate (batch runner parity)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Install
        run: .\tasks.bat install

      - name: Lint (ruff)
        run: .\tasks.bat lint

      - name: Data contracts
        run: .\tasks.bat contracts

      - name: SQL lint (sqlfluff)
        run: .\tasks.bat sql-lint

      - name: Unit + smoke tests
        run: .\tasks.bat test

      - name: Coverage gate
        run: .\tasks.bat cov

      - name: Report fixtures render (no TeX, no database)
        run: .\tasks.bat report-fixture

  pipeline:
    name: full pipeline (uv run main.py)
    needs: [gate, dep-audit, windows-gate]
    # Runs only on pushes to main, never on PRs, so secrets are never
    # exposed to PR code. Skipped entirely while source secrets are unset.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MONGO_URI != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: banking_delta
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: banking_delta
      PG_USER: postgres
      PG_PASS: test-only
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: banking_delta
      PGUSER: postgres
      PGPASSWORD: test-only
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DB: ${{ secrets.MYSQL_DB }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      DATABRICKS_SCHEMA_PUBLIC: ${{ secrets.DATABRICKS_SCHEMA_PUBLIC }}
      DATABRICKS_MARTS_SCHEMA: ${{ secrets.DATABRICKS_MARTS_SCHEMA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Install dependencies
        run: make install

      - name: Set up Java 17 for Spark
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap PostgreSQL schema (audit, source registry, watermarks)
        run: |
          set -euo pipefail
          # Install psql only if the runner doesn't already have it
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y postgresql-client
          fi
          for f in sql/scripts/0*.sql; do
            echo "Applying $f"
            PGPASSWORD="${PG_PASS}" psql -h "${PG_HOST}" -p "${PG_PORT}" -U "${PG_USER}" -d "${PG_DB}" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Check required secrets are set
        run: |
          set -euo pipefail
          missing=0
          for v in MONGO_URI MONGO_DB_NAME MYSQL_HOST MYSQL_PORT MYSQL_USER MYSQL_PASSWORD MYSQL_DB DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_HTTP_PATH DATABRICKS_CATALOG DATABRICKS_SCHEMA_PUBLIC DATABRICKS_MARTS_SCHEMA; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v is empty or not set (Settings > Secrets and variables > Actions > Repository secrets)"
              missing=1
            fi
          done
          exit $missing

      - name: Run full daily pipeline (real sources)
        if: ${{ env.SKIP_MAIN_PY != 'true' }}
        run: uv run main.py --keep-going

      - name: Upload pipeline audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-audit
          path: |
            **/audit/**
            **/test-results.xml
            **/coverage.xml
          retention-days: 7
