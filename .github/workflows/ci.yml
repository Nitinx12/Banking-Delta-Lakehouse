# Required CI gate. Mirrors `make ci` (lint + contracts + sql-lint + unit + smoke),
# running the unit tests under the coverage floor instead of a separate bare run.
# Keep the Make targets as the single source of truth so local == CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # NOTE: job name is a required status check in branch protection. If you rename it, update the rule too.
    name: gate (lint + sql-lint + unit + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Lockfile is in sync with pyproject
        run: uv lock --check

      - name: Install dependencies
        run: make install

      - name: Lint (ruff)
        run: make lint

      - name: Data contracts
        run: make contracts

      - name: SQL lint (sqlfluff)
        run: make sql-lint

      - name: Smoke tests
        run: make smoke

      # `make cov` runs the unit tests under the coverage floor, so unit is not run separately.
      - name: Unit tests + coverage gate
        run: make cov

      - name: Report fixtures render (no TeX, no database)
        run: make report-fixture

  windows-gate:
    name: windows-gate (batch runner parity)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # default shell on Windows runners is pwsh, which won't run `tasks.bat` from the cwd without `.\`
        shell: cmd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Install dependencies
        run: tasks.bat install

      - name: Lint (ruff)
        run: tasks.bat lint

      - name: Data contracts
        run: tasks.bat contracts

      - name: SQL lint (sqlfluff)
        run: tasks.bat sql-lint

      - name: Unit + smoke tests
        run: tasks.bat test

      - name: Coverage gate
        run: tasks.bat cov

      - name: Report fixtures render (no TeX, no database)
        run: tasks.bat report-fixture

  pipeline:
    name: full pipeline (uv run main.py)
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: banking_delta
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: banking_delta
      PG_USER: postgres
      PG_PASS: test-only
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: banking_delta
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Install dependencies
        run: make install

      - name: Set up Java 17 for Spark
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run full daily pipeline
        run: uv run main.py --keep-going
