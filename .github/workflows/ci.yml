# Required CI gate. Mirrors `make ci` (lint + contracts + sql-lint + unit + smoke),
# running the unit tests under the coverage floor instead of a separate bare run.
# Keep the Make targets as the single source of truth so local == CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # NOTE: job name is a required status check in branch protection. If you rename it, update the rule too.
    name: gate (lint + sql-lint + unit + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Lockfile is in sync with pyproject
        run: uv lock --check

      - name: Install dependencies
        run: make install

      - name: Lint (ruff)
        run: make lint

      - name: Data contracts
        run: make contracts

      - name: SQL lint (sqlfluff)
        run: make sql-lint

      - name: Smoke tests
        run: make smoke

      # `make cov` runs the unit tests under the coverage floor, so unit is not run separately.
      - name: Unit tests + coverage gate
        run: make cov

  windows-gate:
    name: windows-gate (batch runner parity)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # default shell on Windows runners is pwsh, which won't run `tasks.bat` from the cwd without `.\`
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Install dependencies
        run: tasks.bat install

      - name: Lint (ruff)
        run: tasks.bat lint

      - name: Data contracts
        run: tasks.bat contracts

      - name: SQL lint (sqlfluff)
        run: tasks.bat sql-lint

      - name: Unit + smoke tests
        run: tasks.bat test

      - name: Coverage gate
        run: tasks.bat cov
