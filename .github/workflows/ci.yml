# CI gate. Mirrors `make ci` (lint + contracts + sql-lint + unit + smoke) and adds
# workflow linting, a dependency audit and a Windows parity run.
#
# Branch protection: require ONLY the `ci-success` check. It aggregates every job
# below, so adding or renaming a job never needs a settings change.
#
# The `pipeline` job runs the real daily pipeline, and only on pushes to main
# (never on PRs, so source secrets are never exposed to PR code). It runs AFTER
# merge: it flags a red main, it cannot block a merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a run on main: the pipeline job talks to
  # real source systems and should not be killed half way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          version=1.7.12   # bump via PR; check the actionlint releases page
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint" && cd "$RUNNER_TEMP/actionlint"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/actionlint_${version}_checksums.txt"
          grep " ${tarball}\$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint

      # Installed under RUNNER_TEMP: /usr/local/bin is not writable without sudo.
      - name: Install zizmor (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zizmor"
          curl -sSfL https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/zizmor.tar.gz"
          echo "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP/zizmor" zizmor
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"

      # GH_TOKEN enables zizmor's online audits (impostor commits, known-vulnerable actions).
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github

  gate:
    name: gate (lint + sql-lint + unit + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Lockfile is in sync with pyproject
        run: uv lock --check

      - name: Install dependencies
        run: make install

      - name: Lint (ruff)
        run: make lint

      - name: Data contracts
        run: make contracts

      - name: SQL lint (sqlfluff)
        run: make sql-lint

      - name: Smoke tests
        run: make smoke

      - name: Unit tests + coverage gate
        run: make cov

      - name: Report fixtures render (no TeX, no database)
        run: make report-fixture

  dep-audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  windows-gate:
    name: windows-gate (batch runner parity)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Install
        run: .\tasks.bat install

      - name: Lint (ruff)
        run: .\tasks.bat lint

      - name: Data contracts
        run: .\tasks.bat contracts

      - name: SQL lint (sqlfluff)
        run: .\tasks.bat sql-lint

      - name: Unit + smoke tests
        run: .\tasks.bat test

      - name: Coverage gate
        run: .\tasks.bat cov

      - name: Report fixtures render (no TeX, no database)
        run: .\tasks.bat report-fixture

  # The `secrets` context is NOT allowed in a job-level `if`, so the original
  # `secrets.MONGO_URI != ''` condition made this whole workflow invalid.
  # Instead, a tiny job reads the secret and exposes a boolean output.
  secrets-check:
    name: source secrets configured?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          if [ -n "$MONGO_URI" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source secrets are not configured; skipping the full pipeline run."
          fi

  pipeline:
    name: full pipeline (uv run main.py)
    needs: [gate, dep-audit, windows-gate, secrets-check]
    if: needs.secrets-check.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: banking_delta
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: banking_delta
      PG_USER: postgres
      PG_PASS: test-only
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: banking_delta
      PGUSER: postgres
      PGPASSWORD: test-only
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DB: ${{ secrets.MYSQL_DB }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      DATABRICKS_SCHEMA_PUBLIC: ${{ secrets.DATABRICKS_SCHEMA_PUBLIC }}
      DATABRICKS_MARTS_SCHEMA: ${{ secrets.DATABRICKS_MARTS_SCHEMA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from pyproject)
        run: uv python install

      - name: Install dependencies
        run: make install

      - name: Set up Java 17 for Spark
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap PostgreSQL schema (audit, source registry, watermarks)
        run: |
          set -euo pipefail
          # Install psql only if the runner doesn't already have it
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y postgresql-client
          fi
          for f in sql/scripts/0*.sql; do
            echo "Applying $f"
            PGPASSWORD="${PG_PASS}" psql -h "${PG_HOST}" -p "${PG_PORT}" -U "${PG_USER}" -d "${PG_DB}" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Check required secrets are set
        run: |
          set -euo pipefail
          missing=0
          for v in MONGO_URI MONGO_DB_NAME MYSQL_HOST MYSQL_PORT MYSQL_USER MYSQL_PASSWORD MYSQL_DB DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_HTTP_PATH DATABRICKS_CATALOG DATABRICKS_SCHEMA_PUBLIC DATABRICKS_MARTS_SCHEMA; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v is empty or not set (Settings > Secrets and variables > Actions > Repository secrets)"
              missing=1
            fi
          done
          exit $missing

      # Kill switch: set the repository VARIABLE SKIP_MAIN_PY=true to skip this step.
      - name: Run full daily pipeline (real sources)
        if: ${{ vars.SKIP_MAIN_PY != 'true' }}
        run: uv run main.py --keep-going

      - name: Upload pipeline audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-audit
          path: |
            **/audit/**
            **/test-results.xml
            **/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # Single status for branch protection. Skipped jobs (pipeline on PRs) count as
  # passing; failed or cancelled jobs fail it.
  ci-success:
    name: ci-success
    if: always()
    needs: [workflow-lint, gate, dep-audit, windows-gate, pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more required CI jobs did not succeed."
          exit 1

      - name: All required jobs passed
        run: echo "ci OK"
