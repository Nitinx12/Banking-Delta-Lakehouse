# Applies labels from .github/labeler.yml based on the files a PR touches.
# Note: with `pull_request`, PRs from forks get a read-only token and labeling is
# skipped. That is fine for a private repo; for public forks see the actions/labeler
# README (pull_request_target is safe here only because no PR code is checked out).
name: labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label PR by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          sync-labels: true # remove a label if its files are no longer in the PR
