# Dependabot configuration for automated dependency updates
# Updates grouped by ecosystem and scheduled weekly.
# cooldown: a release must be public for 7 days before Dependabot proposes it
# (supply-chain hardening). Security updates ignore the cooldown.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/airflow"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
      - "airflow"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
      - "dashboard"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/reports"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
      - "reports"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
      - "pipeline"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
