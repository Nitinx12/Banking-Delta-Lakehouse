name: Feature request
description: Propose a new capability or an improvement
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen. Note anything that touches watermarks, DQ thresholds, pools or the registry schema (needs approval).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Systems touched (raw/staging/analytics/marts/audit/Databricks/dashboard), migration needed, backwards compatibility.
    validations:
      required: false
