# Goes in .github/labeler.yml  (config for actions/labeler)
# One label per area of the repo, matching the layout in ARCHITECTURE.md §3.

extract:
  - changed-files:
      - any-glob-to-any-file:
          - src/jobs/extract_*.py
          - src/utils/extract_runner.py
          - src/utils/spark_io.py
          - scripts/run_jobs.py
          - scripts/seed_watermarks.py

publish:
  - changed-files:
      - any-glob-to-any-file:
          - src/jobs/publish_marts.py

core-utils:
  - changed-files:
      - any-glob-to-any-file:
          - src/utils/**
          - main.py

sql-bootstrap:
  - changed-files:
      - any-glob-to-any-file:
          - sql/scripts/**

sql-staging:
  - changed-files:
      - any-glob-to-any-file:
          - sql/staging/**

sql-analytics:
  - changed-files:
      - any-glob-to-any-file:
          - sql/analytics/**

sql-marts:
  - changed-files:
      - any-glob-to-any-file:
          - sql/marts/**

data-quality:
  - changed-files:
      - any-glob-to-any-file:
          - tests/data-quality/**
          - scripts/run_*_tests.py

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/unit/**
          - tests/smoke/**
          - tests/conftest.py

contracts:
  - changed-files:
      - any-glob-to-any-file:
          - contracts/**

airflow:
  - changed-files:
      - any-glob-to-any-file:
          - airflow/**

dashboard:
  - changed-files:
      - any-glob-to-any-file:
          - dashboard/**

# NEW: reports/ had no label at all.
reports:
  - changed-files:
      - any-glob-to-any-file:
          - reports/**

# NEW: Dockerfiles. Dependabot also applies a "docker" label; because the labeler
# runs with sync-labels, it must be defined here or the labeler would strip it.
docker:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Dockerfile*"
          - .dockerignore

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - Makefile
          - tasks.bat

# FIXED: Dependabot adds "dependencies" to its PRs, but with sync-labels the labeler
# removed it again whenever the PR touched only workflows or Dockerfiles (not
# pyproject.toml / uv.lock). Matching on Dependabot's branch name keeps it.
dependencies:
  - head-branch: ["^dependabot/"]
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"
