# Quiet JVM logging for Spark. Loaded via -Dlog4j2.configurationFile (see engine.py).
# Python-level app logging is handled by utils/logger.py; this only tames Spark's JVM.

status = error
name = BankingSparkLogConfig

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}: %m%n

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

# Windows cannot delete the locked connector jar on shutdown; the failure is harmless.
logger.sparkenv.name = org.apache.spark.SparkEnv
logger.sparkenv.level = error
logger.shutdownhook.name = org.apache.spark.util.ShutdownHookManager
logger.shutdownhook.level = off

# "Truncated the string representation of a plan" noise from large reads.
logger.plans.name = org.apache.spark.sql.catalyst.util.SparkStringUtils
logger.plans.level = error

# Benign: native Hadoop lib absent on Windows, and we set spark.local.dir on purpose.
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
logger.sparkconf.name = org.apache.spark.SparkConf
logger.sparkconf.level = error
