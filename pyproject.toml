[project]
name = "banking"
version = "0.1.0"
description = "Banking-Delta-Lakehouse: daily MySQL/MongoDB/Databricks -> PySpark -> PostgreSQL -> Databricks Delta pipeline"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspark>=3.5.3,<3.6",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "pymongo>=4.7",
    "python-dotenv>=1.0",
    "databricks-sql-connector>=3.0",
    "pyarrow>=15",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "rich>=15.0.0",
    "databricks-sdk>=0.154.0",
    "streamlit==1.62.0",
    "pandas>=3.0,<4",
    "plotly>=7.0,<8",
]

# dev group: make lint / make test (uv sync installs it by default)
[dependency-groups]
dev = [
    "apache-airflow-providers-standard>=1.0.0",
    "apache-airflow==3.3.2",
    "pytest-cov>=7.1.0",
    "pytest>=8.3",
    "ruff==0.12.0",
    "sqlfluff>=3.3,<4",
]
reports = [
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
default-groups = ["dev", "reports"]

[tool.ruff]
extend-exclude = ["notebooks"]

[tool.setuptools.packages.find]
include = ["contracts*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests", "airflow/tests"]
markers = [
    "unit: pure, isolated tests (no DB, no network)",
    "smoke: imports, CLIs, repo/SQL/env contracts",
    "spark: local-Spark tests (needs Java)",
    "integration: behavioural tests on a disposable Postgres",
    "live: read-only checks against the configured environment",
    "spark_smoke: alias kept for runner scripts that predate the 'spark' marker",
    "tex: report compile tests (needs latexmk)",
]
filterwarnings = ["ignore::DeprecationWarning:airflow.*"]

[tool.coverage.run]
branch = true
source = ["src", "scripts", "airflow/include", "reports"]

[tool.coverage.report]
show_missing = true
# Operational floor, not a target: raise it as unit tests land (never lower it
# without a written reason in the PR). Current unit tier covers airflow/ +
# utils + trend helpers.
fail_under = 10
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]
