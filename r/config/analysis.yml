# Analysis configuration. Thresholds, horizons, seeds, mart lists live here, not in code.

gate:
  default_max_age_hours: 30
  check_audit: true

marts:
  mart_monthly_transactions:
    freshness_col: month_start
    max_age_hours: 840
  mart_kpi_monthly:
    freshness_col: month_start
    max_age_hours: 840
  mart_card_fraud:
    freshness_col: month_start
    max_age_hours: 840
  mart_support_performance:
    freshness_col: month_opened
    max_age_hours: 840
  mart_customer_360:
    freshness_col: mart_refreshed_at
    max_age_hours: 100
  mart_branch_performance:
    freshness_col: mart_refreshed_at
    max_age_hours: 100
  mart_loan_portfolio:
    freshness_col: mart_refreshed_at
    max_age_hours: 100

small_cell_threshold: 10
seed: 20261028
forecast_horizon: 3        # backtest horizon (months)
projection_horizon: 6      # future projection horizon (months)
forecast_min_months: 30    # distinct months needed before a backtest is run
retention_days: 30

kpi:
  forecast_measure: null

# Series to forecast. Rows of the same month are combined with `agg`
# (sum for flows/counts, mean only for genuinely averaged measures).
forecasts:
  - mart: mart_kpi_monthly
    label: kpi_txn
    date_col: month_start
    value_col: txn_amount
    agg: sum
  - mart: mart_monthly_transactions
    label: txn_total
    date_col: month_start
    value_col: total_amount
    agg: sum

variance_bridges:
  - mart: mart_kpi_monthly
    label: txn_amount
    date_col: month_start
    value_col: txn_amount
    count_col: txn_count
  - mart: mart_kpi_monthly
    label: loan_amount_disbursed
    date_col: month_start
    value_col: loan_amount_disbursed
    count_col: loans_disbursed
